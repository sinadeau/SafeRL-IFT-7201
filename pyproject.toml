[project]
name = "saferl-ift-7201"
version = "0.1.0"
description = "Safe RL in a non-deterministic environment (Frozen lake V1)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.2.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "setuptools>=82.0.1",
    "stable-baselines3[extra]>=2.7.1",
    "torch>=2.10.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
